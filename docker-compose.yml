version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: billing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d billing_service']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src:ro

volumes:
  postgres_data:
